[profile.default]
src      = "src"
out      = "out"
libs     = ["lib"]
solc     = "0.8.24"
optimizer = true
optimizer_runs = 200
via_ir   = false

[profile.default.rpc_endpoints]
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com/rpc"
robinhood_mainnet = "https://rpc.mainnet.chain.robinhood.com"

[profile.default.etherscan]
robinhood_testnet = { key = "verifykey", url = "https://explorer.testnet.chain.robinhood.com/api" }

[fmt]
line_length   = 100
tab_width     = 4
bracket_spacing = true
